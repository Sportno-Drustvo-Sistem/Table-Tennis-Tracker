name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "Missing GitHub secret: VITE_SUPABASE_URL"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing GitHub secret: VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Ping Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_KEEPALIVE_TABLE: ${{ secrets.SUPABASE_KEEPALIVE_TABLE }}
          SUPABASE_KEEPALIVE_COLUMN: ${{ secrets.SUPABASE_KEEPALIVE_COLUMN }}
          SUPABASE_KEEPALIVE_SCHEMA: ${{ secrets.SUPABASE_KEEPALIVE_SCHEMA }}
        run: npm run db:keepalive
