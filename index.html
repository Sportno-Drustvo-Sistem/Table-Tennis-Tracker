<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
  <title>Sport Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://code.responsivevoice.org/responsivevoice.js?key=YOUR_UNIQUE_KEY_HERE"></script>
</head>

<body>
  <script>
    // Apply theme and sport accent before React renders to prevent flash
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark')
      }
      document.documentElement.dataset.sport = localStorage.getItem('activeSport') || 'pingpong'
    } catch (e) { }
  </script>
  <div id="root"></div>
  <script src="/runtime-config.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
